[project]
name = "pyjmri"
version = "0.1.0"
description = "Async Python client for the JMRI web server"
readme = "README.md"
authors = [
    { name = "Mike Dean", email = "miketraindoc@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "websockets>=16.0",
]

[build-system]
requires = ["uv_build>=0.7.6,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "psutil>=5.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "twine>=6.2.0",
    "ipykernel>=6.29.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real JMRI instance on localhost:12080; excluded from CI",
    "slow: long-running tests intended for manual / pre-release invocation; excluded from the default test run",
]
