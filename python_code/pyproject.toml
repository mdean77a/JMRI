[project]
name = "pyjmri"
version = "1.2.1"
description = "Async Python client for the JMRI web server"
readme = "README.md"
authors = [
    { name = "Mike Dean", email = "miketraindoc@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/mdean77a/JMRI"
Source = "https://github.com/mdean77a/JMRI"
Issues = "https://github.com/mdean77a/JMRI/issues"
Documentation = "https://github.com/mdean77a/JMRI/blob/master/python_code/README.md"

[build-system]
requires = ["uv_build>=0.7.6,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "psutil>=5.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "twine>=6.2.0",
    "ipykernel>=6.29.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# train_out_and_back.py is a personal, gitignored driving script (not a shipped
# example); keep tooling off it so it never gates the build.
extend-exclude = ["*.ipynb", "examples/train_out_and_back.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
# Personal, gitignored driving script (not a shipped example); excluded from the
# strict gate so `mypy --strict examples/` stays green. See .gitignore.
exclude = ['examples/train_out_and_back\.py']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real JMRI instance on localhost:12080; excluded from CI",
    "slow: long-running tests intended for manual / pre-release invocation; excluded from the default test run",
]
